security:
    providers:
        # Drivers are not stored here: built from the driver object kept with this session's Safeway API tokens.
        app_drivers:
            id: App\Security\Driver\DriverUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|driver-app)/
            security: false
        driver:
            # /login is the driver login (the app's front door). The PIN is checked by safeway-dispatch's Driver API.
            pattern: ^/
            lazy: true
            provider: app_drivers
            custom_authenticators:
                - App\Security\Driver\DriverPinAuthenticator
            entry_point: App\Security\Driver\DriverPinAuthenticator
            logout:
                path: app_driver_logout
                target: app_driver_login

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/driver/login$, roles: PUBLIC_ACCESS }
        - { path: ^/driver/sw\.js$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/driver, roles: ROLE_DRIVER }
