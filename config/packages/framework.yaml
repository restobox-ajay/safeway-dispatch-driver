# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Only this app's own host is trusted (host-header injection guard).
    trusted_hosts:
        - '^%env(regex_quote:APP_DOMAIN)%$'

    # Behind a TLS-terminating proxy, list it so X-Forwarded-Proto/For are honoured (Secure cookie, driver IP).
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

    # No database: sessions are PHP session files under var/sessions. The session holds the driver's Safeway
    # API tokens (DriverTokenStore). PHP's files handler locks the session file for the whole request, so one
    # driver's requests never refresh the rotating token at the same time.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        # A driver stays signed in for 30 days of use (the Safeway refresh token also lives 30 days).
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
